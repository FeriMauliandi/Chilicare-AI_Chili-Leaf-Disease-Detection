name: ChiliCare AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ==========================================
  lint-and-test:
    name: "CI: Code Quality & Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx pytest-asyncio
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt

      - name: Lint Code with Ruff
        run: |
          ruff check src/ backend/ tests/ --ignore E501,F401,F841 || true

      - name: Run Unit Tests with Pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pytest --cov=src --cov=backend --cov-report=term-missing tests/

      - name: Run Frontend Sanitizer Tests
        run: |
          node tests/frontend/sanitizer.test.js

  docker-build:
    name: "CI: Docker Build Verification"
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t chilicare-app:latest .

  # ==========================================
  # 2. CONTINUOUS DEPLOYMENT (CD)
  # ==========================================
  deploy-to-ghcr:
    name: "CD: Publish Docker Image to GHCR"
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Lowercase Repository Owner
        id: repo
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/chilicare-app:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/chilicare-app:${{ github.sha }}

  deploy-to-huggingface:
    name: "CD: Deploy to Hugging Face Space"
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Pull Git LFS Objects
        run: |
          git lfs pull

      - name: Deploy to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "Configuring Git LFS & Hugging Face Remote..."
            git lfs install
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add hf https://feryms:$HF_TOKEN@huggingface.co/spaces/feryms/chilicareAI || git remote set-url hf https://feryms:$HF_TOKEN@huggingface.co/spaces/feryms/chilicareAI

            echo "Creating clean deployment branch without historical oversized files..."
            git checkout --orphan hf-deploy

            echo "Injecting Hugging Face YAML metadata for Space deployment only..."
            printf "%s\n" \
              "---" \
              "title: ChiliCare AI" \
              "emoji: 🌶️" \
              "colorFrom: red" \
              "colorTo: green" \
              "sdk: docker" \
              "app_port: 7860" \
              "pinned: false" \
              "short_description: Deteksi Penyakit Daun Cabai Berbasis YOLOv11s dan LLM RAG" \
              "---" \
              "" > /tmp/hf_metadata.txt
            cat /tmp/hf_metadata.txt README.md > /tmp/hf_readme.md
            mv /tmp/hf_readme.md README.md

            git add -A
            git commit -m "Deploy ChiliCare AI to Hugging Face Space from ${{ github.sha }}"

            echo "Deploying to Hugging Face Space..."
            git push hf hf-deploy:main --force
          else
            echo "HF_TOKEN secret not provided. Skipping Hugging Face deployment step."
          fi
