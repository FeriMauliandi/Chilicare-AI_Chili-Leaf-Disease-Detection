# Netlify Configuration for ChiliCare AI
# Dokumentasi: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Tetapkan Base directory ke folder frontend agar Netlify TIDAK mendeteksi requirements.txt di root
  base = "frontend"

  # Direktori yang dipublikasikan relatif terhadap Base directory
  publish = "."

  # Static HTML/CSS/JS murni, tidak memerlukan build command atau pip install
  command = ""

# Routing halaman:
# 1. Mengarahkan URL /app ke aplikasi diagnosis (app.html)
[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

# 2. Mengarahkan /landing.html ke halaman utama (/)
[[redirects]]
  from = "/landing.html"
  to = "/"
  status = 301
